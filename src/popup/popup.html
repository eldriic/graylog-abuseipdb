<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon.svg" alt="" width="22" height="22">
    <h1>AbuseIPDB Lookup</h1>
    <button type="button" id="refresh" class="icon-btn" title="Actualiser les IP de la page" aria-label="Actualiser les IP de la page">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
        <path d="M21 3v6h-6"/>
      </svg>
    </button>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" data-tab="analysis">Analyse</button>
    <button type="button" class="tab" role="tab" data-tab="settings">Paramètres</button>
  </nav>

  <main id="tab-analysis" role="tabpanel" hidden>
    <div id="noKey" class="banner" hidden>
      Aucune clé API configurée. <a href="#" id="noKeyLink">Ouvrir les paramètres</a>
    </div>
    <div id="siteBanner" class="banner site-banner" hidden>
      <span>L'analyse n'est pas activée sur <strong id="siteHost"></strong>.</span>
      <button type="button" id="enableSite">Activer sur ce site</button>
    </div>

    <section>
      <form id="lookupForm" class="input-row">
        <input id="ipInput" type="text" placeholder="Vérifier une IP (ex : 8.8.8.8)" autocomplete="off" spellcheck="false">
        <button type="submit">Vérifier</button>
      </form>
      <div id="lookupResult"></div>
    </section>

    <section>
      <div class="section-title">
        <span>IP sur cette page</span>
        <span id="fieldName" class="muted"></span>
      </div>
      <div class="list-actions">
        <div id="summary" class="summary"></div>
        <button type="button" id="copyIps" class="secondary small-btn" title="Copier les IP publiques, une par ligne" disabled>Copier</button>
        <button type="button" id="exportCsv" class="secondary small-btn" title="Télécharger les résultats au format CSV" disabled>CSV</button>
      </div>
      <ul id="ipList" class="ip-list"></ul>
      <div id="emptyMsg" class="muted center" hidden></div>
    </section>
  </main>

  <main id="tab-settings" class="settings" role="tabpanel" hidden></main>

  <template id="ipCardTpl">
    <li class="ip-card">
      <div class="ip-row">
        <span class="score"></span>
        <span class="ip"></span>
        <span class="place muted"></span>
        <span class="chevron" title="Voir les détails">▶</span>
      </div>
      <div class="details" hidden></div>
    </li>
  </template>

  <script src="../shared/api.js"></script>
  <script src="../shared/ip.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="../shared/sites.js"></script>
  <script src="../shared/settings-panel.js"></script>
  <script src="export.js"></script>
  <script src="popup.js"></script>
</body>
</html>
